name: Test skip python install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify system python is available
        run: |
          python3 --version || python --version
          echo "System python is available"

      - id: action
        uses: .
        with:
          python-version: "3.11"
          install-python: "false"
          run-stew: "false"
          python-exec: "python3"

      - name: Assert poetry is installed
        run: |
          echo "Checking poetry installation..."
          if ! command -v poetry &>/dev/null; then
            echo "FAIL: poetry not found in PATH"
            exit 1
          fi
          echo "PASS: poetry found at $(command -v poetry)"

      - name: Assert stew is installed
        run: |
          echo "Checking stew installation..."
          if ! command -v stew &>/dev/null; then
            echo "FAIL: stew not found in PATH"
            exit 1
          fi
          echo "PASS: stew found at $(command -v stew)"
